---
- name: Install development tools
  ansible.builtin.apt:
    name:
      - docker.io
      - git
      - curl
      - jq
    state: present
    update_cache: true
- name: Configure system proxy
  ansible.builtin.copy:
    dest: /etc/profile.d/sandbox-proxy.sh
    mode: '0644'
    content: |
      export HTTP_PROXY=http://10.20.0.1:3128
      export HTTPS_PROXY=http://10.20.0.1:3128
      export NO_PROXY=localhost,127.0.0.1
- name: Configure Docker proxy directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'
- name: Configure Docker proxy
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/proxy.conf
    mode: '0644'
    content: |
      [Service]
      Environment="HTTP_PROXY=http://10.20.0.1:3128"
      Environment="HTTPS_PROXY=http://10.20.0.1:3128"
      Environment="NO_PROXY=localhost,127.0.0.1"
  notify: Restart Docker
